# ==========================================
# CONFIGURAÇÕES GLOBAIS
# ==========================================
baseURL = "https://hussyvel.com/"
title = "Hussyvel Ribeiro"
theme = "PaperMod"
defaultContentLanguage = "en" # Define o Inglês como idioma padrão na raiz do site

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  # Ícones globais (redes sociais são as mesmas para ambos os idiomas)
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/hussyvel"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/hussyvelribeiro"

# ==========================================
# IDIOMA 1: INGLÊS (Padrão)
# ==========================================
[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    title = "Hussyvel Ribeiro | Tech Blog"

    [languages.en.params.profileMode]
      enabled = true
      title = "Hi, I'm Hussyvel 👋"
      subtitle = "Full Stack Software Developer | Java, C, Javascript (Angular) and SQL"
      imageUrl = "/perfil-linkedin2.jpeg" # Confirme se o nome da imagem está correto
      imageWidth = 150
      imageHeight = 150

      [[languages.en.params.profileMode.buttons]]
        name = "Read Posts"
        url = "/posts/"
      [[languages.en.params.profileMode.buttons]]
        name = "About Me"
        url = "/about/"
      [[languages.en.params.profileMode.buttons]]
        name = "Java"
        url = "/java/"
      [[languages.en.params.profileMode.buttons]]
        name = "JavaScript"
        url = "/javascript/"
      [[languages.en.params.profileMode.buttons]]
        name = "SQL"
        url = "/sql/"
      [[languages.en.params.profileMode.buttons]]
        name = "Linux"
        url = "/linux/"

    [[languages.en.menu.main]]
      identifier = "posts"
      name = "Posts"
      url = "/posts/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "/tags/"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
      url = "/about/"
      weight = 30
    [[languages.en.menu.main]]
      identifier = "search"
      name = "Search"
      url = "/search/"
      weight = 40


    [[languages.en.menu.main]]
      identifier = "resume"
      name = "Resume"
      pageRef = "/resume"
      weight = 40
     

