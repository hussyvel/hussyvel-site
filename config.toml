baseURL = "https://hussyvel.com/"
theme = "PaperMod"
defaultContentLanguage = "en"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  defaultTheme = "light"
  mainSections = ["posts"]
  comments = true
  ShowShareButtons = true
  ShareButtons = ["linkedin"]
  [params.giscus]
    repo = "hussyvel/hussyvel-site"
    repoId = "R_kgDOUxJNTg"
    category = "Announcements"
    categoryId = "DIC_kwDOUxJNTs4DKC4e"
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/hussyvel"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/hussyvelribeiro"

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    title = "Hussyvel Ribeiro | Tech Blog"

    [[languages.en.menu.main]]
      identifier = "latest"
      name = "Latest"
      url = "/posts/"
      weight = 10

    [[languages.en.menu.main]]
      identifier = "languages"
      name = "Languages"
      url = "/languages/"
      weight = 20

    [[languages.en.menu.main]]
      identifier = "ai"
      name = "AI"
      url = "/ai/"
      weight = 30

    [[languages.en.menu.main]]
      identifier = "networking"
      name = "Networking"
      url = "/networking/"
      weight = 40

    [[languages.en.menu.main]]
      identifier = "infrastructure"
