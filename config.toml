baseURL = "https://hussyvel.com/"
theme = "PaperMod"
defaultContentLanguage = "en"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  defaultTheme = "light"
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/hussyvel"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/hussyvelribeiro"

[languages]
