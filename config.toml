baseURL = "https://hussyvel.com/"
theme = "PaperMod"
defaultContentLanguage = "en"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/hussyvel"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/hussyvelribeiro"

[languages]
  # ==========================================
  # IDIOMA 1: INGLÊS (Padrão)
  # ==========================================
  [languages.en]
    languageName = "English"
    weight = 1
    title = "Hussyvel Ribeiro | Tech Blog"

    [languages.en.params.profileMode]
      enabled = true
      title = "Hi, I'm Hussyvel 👋"
      subtitle = "Full Stack Software Developer | Java, GO, C, Javascript (Angular) and SQL"
      imageUrl = "/img/perfil-linkedin2.jpeg"
      imageWidth = 150
      imageHeight = 150

[[languages.en.menu.main]]
      identifier = "posts"
      name = "Posts"
      url = "/posts/"
      weight = 10

    [[languages.en.menu.main]]
      identifier = "about"
      name = "Biography"
      url = "/about/"
      weight = 20

